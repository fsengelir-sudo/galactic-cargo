name: Build Android App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm install @capacitor-community/admob
          npm run build

      - name: Generate Fresh Android Folder & Inject AdMob
        run: |
          rm -rf android
          npx cap add android
          
          # AndroidManifest.xml içine AdMob Test ID'sini güvenli bir şekilde ekler
          MANIFEST_PATH="android/app/src/main/AndroidManifest.xml"
          python3 -c "
          path = '$MANIFEST_PATH'
          with open(path, 'r') as f:
              content = f.read()
          meta_tag = '''
              
          '''
          if 'APPLICATION_ID' not in content:
              content = content.replace('    ', meta_tag + '    ')
              with open(path, 'w') as f:
                  f.write(content)
              print('AdMob Manifest başarıyla eklendi!')
          "

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Android Release Bundle
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Sign Android Release Bundle
        uses: r0adkll/sign-android@v2
        with:
          releaseDir: android/app/build/outputs/bundle/release
          alias: ${{ secrets.KEY_ALIAS }}
          release: true
          keystoreBase64: ${{ secrets.KEYSTORE_BASE64 }}
          storePassword: ${{ secrets.STORE_PASSWORD }}
          keyPassword: ${{ secrets.KEY_PASSWORD }}

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab