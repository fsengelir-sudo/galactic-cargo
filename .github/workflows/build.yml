name: Build Android App

on:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Dependencies & Build Web
        run: |
          npm install
          npm install @capacitor-community/admob
          npm run build

      - name: Setup Android, AdMob & Keystore Signing
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          rm -rf android
          npx cap add android
          
          # 1. Base64 keystore dosyasını projeye çöz
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/my-release-key.jks

          # 2. Python ile Manifest ve build.gradle Ayarlarını Yapılandır
          python3 -c "
          # AdMob Manifest Ekleme
          manifest_path = 'android/app/src/main/AndroidManifest.xml'
          with open(manifest_path, 'r') as f:
              m_content = f.read()
          meta_tag = '''
              
          '''
          if 'APPLICATION_ID' not in m_content:
              m_content = m_content.replace('    ', meta_tag + '    ')
              with open(manifest_path, 'w') as f:
                  f.write(m_content)

          # build.gradle Düzenleme (compileSdk ve signingConfigs)
          gradle_path = 'android/app/build.gradle'
          with open(gradle_path, 'r') as f:
              g_content = f.read()

          if 'compileSdk' not in g_content:
              g_content = g_content.replace('android {', 'android {\n    compileSdk 34')

          signing_configs_block = '''
              signingConfigs {
                  release {
                      storeFile file('my-release-key.jks')
                      storePassword System.getenv(\"STORE_PASSWORD\")
                      keyAlias System.getenv(\"KEY_ALIAS\")
                      keyPassword System.getenv(\"KEY_PASSWORD\")
                  }
              }
          '''
          if 'signingConfigs' not in g_content:
              g_content = g_content.replace('android {', 'android {' + signing_configs_block)

          if 'signingConfig signingConfigs.release' not in g_content:
              g_content = g_content.replace('release {', 'release {\n            signingConfig signingConfigs.release', 1)

          with open(gradle_path, 'w') as f:
              f.write(g_content)
          print('build.gradle başarıyla güncellendi!')
          "

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build & Sign Android Release Bundle
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew bundleRelease

      - name: Upload AAB Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-release-aab
          path: android/app/build/outputs/bundle/release/app-release.aab